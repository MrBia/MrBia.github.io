
<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Game Arcade</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10131c;
      color: #f5f5f5;
    }

    /* HEADER */

    header {
      padding: 35px 20px;
      text-align: center;
      background: #191f30;
    }

    header h1 {
      margin: 0 0 10px;
    }

    header p {
      color: #aab2c5;
    }

    /* MAIN */

    main {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    /* SEARCH */

    .toolbar {
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #343c50;
      border-radius: 8px;
      background: #191f30;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #5865f2;
    }

    /* GAME GRID */

    .games {
      display: grid;
      grid-template-columns: repeat(
        auto-fill,
        minmax(230px, 1fr)
      );
      gap: 22px;
      align-items: stretch;
    }

    /* GAME CARD */

    .game-card {
      position: relative;
      display: flex;
      flex-direction: column;

      height: 340px;
      min-width: 0;

      overflow: hidden;

      background: #191f30;
      border: 1px solid #293149;
      border-radius: 12px;

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        border-color 0.25s ease;
    }

    .game-card:hover,
    .game-card:focus-within {
      transform: translateY(-7px) scale(1.02);
      border-color: #5865f2;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      z-index: 2;
    }

    /* GAME IMAGE */

    .game-image {
      position: relative;
      flex-shrink: 0;

      height: 155px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      background: #252e45;
      font-size: 55px;
    }

    .game-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;

      transition: transform 0.35s ease;
    }

    .game-card:hover .game-image img {
      transform: scale(1.08);
    }

    /* GAME CONTENT */

    .game-content {
      position: relative;

      display: flex;
      flex-direction: column;
      flex: 1;

      min-height: 0;
      padding: 15px;
    }

    .game-content h3 {
      margin: 0 0 8px;

      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .category {
      color: #8fa5ff;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .description {
      color: #aab2c5;
      font-size: 14px;
      line-height: 1.5;

      overflow: hidden;

      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    /* PLAY BUTTON */

    .play-button {
      display: block;
      flex-shrink: 0;

      padding: 11px;
      margin: 0 15px 15px;

      text-align: center;

      background: #5865f2;
      color: white;

      text-decoration: none;
      border-radius: 7px;

      transition: background 0.2s ease;
    }

    .play-button:hover {
      background: #4752c4;
    }

    /* DESCRIPTION OVERLAY */

    .description-overlay {
      position: absolute;
      inset: 0;
      z-index: 3;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 22px;

      background: rgba(12, 16, 29, 0.94);
      color: white;

      font-size: 14px;
      line-height: 1.7;

      overflow-y: auto;

      opacity: 0;
      visibility: hidden;

      transition:
        opacity 0.25s ease,
        visibility 0.25s ease;
    }

    .game-card:hover .description-overlay,
    .game-card:focus-within .description-overlay,
    .game-card.show-description .description-overlay {
      opacity: 1;
      visibility: visible;
    }

    /* MESSAGE */

    #message {
      color: #aab2c5;
      text-align: center;
      padding: 30px;
    }

    /* FOOTER */

    footer {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    footer a {
      color: #8fa5ff;
      text-decoration: none;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      .games {
        grid-template-columns: repeat(
          2,
          minmax(0, 1fr)
        );

        gap: 12px;
      }

      .game-card {
        height: 310px;
      }

      .game-image {
        height: 125px;
      }

      .game-content {
        padding: 10px;
      }

      .play-button {
        margin: 0 10px 10px;
      }

      .game-card:hover {
        transform: none;
      }
    }

    /* REDUCED MOTION */

    @media (prefers-reduced-motion: reduce) {

      .game-card,
      .game-image img,
      .play-button,
      .description-overlay {
        transition: none;
      }
    }

  </style>
</head>

<body>

  <!-- HEADER -->

  <header>
    <h1>🎮 My Game Arcade</h1>
    <p>Discover and play my small games</p>
  </header>

  <!-- MAIN -->

  <main>

    <div class="toolbar">
      <input
        id="search"
        type="text"
        placeholder="Search games..."
      >
    </div>

    <div id="message">
      Loading games...
    </div>

    <div id="games" class="games"></div>

  </main>

  <!-- FOOTER -->

  <footer>
    My Game Arcade ·
    <a href="./admin.html">Admin</a>
  </footer>

  <!-- FIREBASE -->

  <script type="module">

    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

    import {
      getFirestore,
      collection,
      query,
      orderBy,
      onSnapshot
    } from
      "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

    import {
      firebaseConfig
    } from "./firebase-config.js";


    // INITIALIZE FIREBASE

    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);


    // DOM ELEMENTS

    const gamesElement =
      document.getElementById("games");

    const messageElement =
      document.getElementById("message");

    const searchElement =
      document.getElementById("search");


    // GAME DATA

    let allGames = [];


    // ESCAPE HTML

    function escapeHTML(value) {

      return String(value ?? "").replace(
        /[&<>"']/g,
        char => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[char]
      );

    }


    // VALIDATE GAME URL

    function safeGameURL(value) {

      const url = String(value || "").trim();

      if (/^https:\/\//i.test(url)) {
        return url;
      }

      if (
        /^(?!\/)(?!.*(?:^|\/)\.\.(?:\/|$))[a-zA-Z0-9._/-]+\/?$/.test(url)
      ) {
        return url;
      }

      return "";

    }


    // VALIDATE IMAGE URL

    function safeImageURL(value) {

      const url = String(value || "").trim();

      if (/^https:\/\//i.test(url)) {
        return url;
      }

      if (
        /^(?!\/)(?!.*(?:^|\/)\.\.(?:\/|$))[a-zA-Z0-9._/-]+\.(png|jpg|jpeg|webp|gif)$/i.test(url)
      ) {
        return url;
      }

      return "";

    }


    // RENDER GAMES

    function renderGames() {

      const keyword =
        searchElement.value.toLowerCase().trim();


      // FILTER GAMES

      const filtered = allGames.filter(game => {

        const content = [
          game.name,
          game.category,
          game.description
        ].join(" ").toLowerCase();

        return content.includes(keyword);

      });


      gamesElement.innerHTML = "";


      if (filtered.length === 0) {

        messageElement.textContent = "No games found.";

        return;

      }


      messageElement.textContent = "";


      // CREATE GAME CARDS

      filtered.forEach(game => {

        const card = document.createElement("div");

        card.className = "game-card";


        const imageURL = safeImageURL(game.imageUrl);

        const gameURL = safeGameURL(game.url);


        const imageHTML = imageURL

          ? `<img src="${escapeHTML(imageURL)}" alt="">`

          : escapeHTML(game.emoji || "🎮");


        card.innerHTML = `

          <div class="game-image">

            ${imageHTML}

          </div>


          <div class="game-content">

            <h3 title="${escapeHTML(game.name)}">

              ${escapeHTML(game.name)}

            </h3>


            <div class="category">

              ${escapeHTML(game.category)}

            </div>


            <p class="description">

              ${escapeHTML(game.description)}

            </p>

          </div>


          <div class="description-overlay">

            ${escapeHTML(
              game.description || "No description available."
            )}

          </div>


          ${
            gameURL

              ? `
                <a
                  class="play-button"
                  href="${escapeHTML(gameURL)}"
                >
                  ▶ Play Now
                </a>
              `

              : `
                <span class="play-button">
                  Game URL unavailable
                </span>
              `
          }

        `;


        // EXTERNAL GAME LINK

        if (gameURL && /^https:\/\//i.test(gameURL)) {

          const link = card.querySelector("a");

          link.target = "_blank";

          link.rel = "noopener noreferrer";

        }


        // MOBILE DESCRIPTION TOGGLE

        card.addEventListener("click", event => {

          if (event.target.closest(".play-button")) {
            return;
          }

          if (window.matchMedia("(hover: none)").matches) {

            card.classList.toggle("show-description");

          }

        });


        gamesElement.appendChild(card);

      });

    }


    // SEARCH EVENT

    searchElement.addEventListener(
      "input",
      renderGames
    );


    // LOAD GAMES FROM FIRESTORE

    const gamesQuery = query(

      collection(db, "games"),

      orderBy("order", "asc")

    );


    onSnapshot(

      gamesQuery,

      snapshot => {

        allGames = snapshot.docs.map(doc => doc.data());

        renderGames();

      },

      error => {

        console.error(error);

        messageElement.textContent =
          "Cannot load games. Please check your Firebase configuration and Firestore rules.";

      }

    );

  </script>

</body>
</html>
