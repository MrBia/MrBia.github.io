
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Game Arcade</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10131c;
      color: #f5f5f5;
    }

    header {
      padding: 35px 20px;
      text-align: center;
      background: #191f30;
    }

    header h1 { margin: 0 0 10px; }
    header p { color: #aab2c5; }

    main {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .toolbar {
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #343c50;
      border-radius: 8px;
      background: #191f30;
      color: white;
      font-size: 16px;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 20px;
    }

    .game-card {
      overflow: hidden;
      background: #191f30;
      border: 1px solid #293149;
      border-radius: 12px;
    }

    .game-image {
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #252e45;
      font-size: 55px;
    }

    .game-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .game-content { padding: 16px; }
    .game-content h3 { margin: 0 0 8px; }
    .category { color: #8fa5ff; font-size: 13px; }
    .description {
      color: #aab2c5;
      min-height: 42px;
      line-height: 1.5;
    }

    .play-button {
      display: block;
      padding: 11px;
      margin-top: 15px;
      text-align: center;
      background: #5865f2;
      color: white;
      text-decoration: none;
      border-radius: 7px;
    }

    .play-button:hover { background: #4752c4; }

    #message {
      color: #aab2c5;
      text-align: center;
      padding: 30px;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    footer a { color: #8fa5ff; }

  </style>
</head>

<body>

  <header>
    <h1>🎮 My Game Arcade</h1>
    <p>Discover and play my small games</p>
  </header>

  <main>
    <div class="toolbar">
      <input
        id="search"
        type="text"
        placeholder="Search games..."
      >
    </div>

    <div id="message">Loading games...</div>
    <div id="games" class="games"></div>
  </main>

  <footer>
    My Game Arcade · <a href="./admin.html">Admin</a>
  </footer>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

    import {
      getFirestore,
      collection,
      query,
      orderBy,
      onSnapshot
    } from
      "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

    import { firebaseConfig } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const gamesElement = document.getElementById("games");
    const messageElement = document.getElementById("message");
    const searchElement = document.getElementById("search");

    let allGames = [];

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function safeGameURL(value) {
      const url = String(value || "").trim();

      if (/^https:\/\//i.test(url)) return url;

      if (
        /^(?!\/)(?!.*(?:^|\/)\.\.(?:\/|$))[a-zA-Z0-9._/-]+\/?$/.test(url)
      ) {
        return url;
      }

      return "";
    }

    function safeImageURL(value) {
      const url = String(value || "").trim();

      if (/^https:\/\//i.test(url)) return url;

      if (
        /^(?!\/)(?!.*(?:^|\/)\.\.(?:\/|$))[a-zA-Z0-9._/-]+\.(png|jpg|jpeg|webp|gif)$/i.test(url)
      ) {
        return url;
      }

      return "";
    }

    function renderGames() {
      const keyword = searchElement.value.toLowerCase().trim();

      const filtered = allGames.filter(game => {
        const content = [
          game.name,
          game.category,
          game.description
        ].join(" ").toLowerCase();

        return content.includes(keyword);
      });

      gamesElement.innerHTML = "";

      if (filtered.length === 0) {
        messageElement.textContent = "No games found.";
        return;
      }

      messageElement.textContent = "";

      filtered.forEach(game => {
        const card = document.createElement("div");
        card.className = "game-card";

        const imageURL = safeImageURL(game.imageUrl);
        const gameURL = safeGameURL(game.url);

        const imageHTML = imageURL
          ? `<img src="${escapeHTML(imageURL)}" alt="">`
          : escapeHTML(game.emoji || "🎮");

        card.innerHTML = `
          <div class="game-image">${imageHTML}</div>
          <div class="game-content">
            <h3>${escapeHTML(game.name)}</h3>
            <div class="category">${escapeHTML(game.category)}</div>
            <p class="description">${escapeHTML(game.description)}</p>
            ${gameURL
              ? `<a class="play-button" href="${escapeHTML(gameURL)}">▶ Play Now</a>`
              : `<span class="play-button">Game URL unavailable</span>`
            }
          </div>
        `;

        if (gameURL && /^https:\/\//i.test(gameURL)) {
          card.querySelector("a")?.setAttribute("target", "_blank");
          card.querySelector("a")?.setAttribute("rel", "noopener noreferrer");
        }

        gamesElement.appendChild(card);
      });
    }

    searchElement.addEventListener("input", renderGames);

    const gamesQuery = query(
      collection(db, "games"),
      orderBy("order", "asc")
    );

    onSnapshot(gamesQuery, snapshot => {
      allGames = snapshot.docs.map(doc => doc.data());
      renderGames();
    }, error => {
      console.error(error);
      messageElement.textContent =
        "Cannot load games. Please check your Firebase configuration and Firestore rules.";
    });
  </script>

</body>
</html>
