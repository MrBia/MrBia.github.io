
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Game Arcade</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #111827;
            color: #f9fafb;
            min-height: 100vh;
        }

        /* HEADER */

        header {
            background: #1f2937;
            padding: 24px 20px;
            text-align: center;
            border-bottom: 1px solid #374151;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        header p {
            color: #9ca3af;
            font-size: 14px;
        }

        /* MAIN */

        main {
            max-width: 1200px;
            margin: auto;
            padding: 30px 20px 60px;
        }

        /* SEARCH */

        .search-container {
            margin-bottom: 30px;
        }

        #searchInput {
            width: 100%;
            max-width: 500px;
            display: block;
            margin: auto;
            padding: 13px 18px;

            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 10px;

            color: white;
            font-size: 15px;
            outline: none;

            transition: border-color 0.2s;
        }

        #searchInput:focus {
            border-color: #3b82f6;
        }

        #searchInput::placeholder {
            color: #9ca3af;
        }

        /* GAME GRID */

        .games-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 24px;

            align-items: start;
        }

        /* GAME CARD */

        .game-card {
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 14px;

            overflow: hidden;
            min-width: 0;
            min-height: 340px;
            height: auto;

            display: flex;
            flex-direction: column;
            align-self: start;

            transition:
                transform 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: #3b82f6;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }

        /* GAME IMAGE */

        .game-image {
            width: 100%;
            height: 180px;
            flex-shrink: 0;

            background: #374151;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        .game-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;

            transition: transform 0.35s ease;
        }

        .game-card:hover .game-image img {
            transform: scale(1.05);
        }

        .game-emoji {
            font-size: 65px;
        }

        /* GAME CONTENT */

        .game-content {
            padding: 18px 18px 12px;
            flex: 1;
        }

        .game-title {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 8px;

            overflow-wrap: anywhere;
        }

        .game-category {
            display: inline-block;

            padding: 4px 10px;
            margin-bottom: 10px;

            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;

            border-radius: 20px;
            font-size: 12px;
        }

        .game-short-description {
            color: #9ca3af;
            font-size: 13px;
            line-height: 1.5;

            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;

            overflow: hidden;
        }

        /* PLAY BUTTON */

        .play-button {
            display: block;
            text-align: center;

            margin: 0 18px 18px;
            padding: 11px 15px;

            background: #2563eb;
            color: white;

            text-decoration: none;
            font-weight: bold;
            font-size: 14px;

            border-radius: 8px;

            transition:
                background 0.2s,
                transform 0.2s;
        }

        .play-button:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        /* EXPANDABLE DESCRIPTION */

        .description-overlay {
            position: static;
            width: 100%;

            max-height: 0;
            padding: 0 18px;

            overflow: hidden;

            opacity: 0;
            visibility: hidden;
            pointer-events: none;

            background: #182334;
            color: #d1d5db;

            border-top: 0 solid #374151;

            transition:
                max-height 0.35s ease,
                padding 0.35s ease,
                opacity 0.25s ease,
                visibility 0.25s ease,
                border-width 0.25s ease;
        }

        .description-overlay h3 {
            color: #60a5fa;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .description-overlay p {
            font-size: 13px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        /* Expand on hover and keyboard focus */

        .game-card:hover .description-overlay,
        .game-card:focus-within .description-overlay,
        .game-card.show-description .description-overlay {
            max-height: 180px;
            padding: 15px 18px 18px;

            opacity: 1;
            visibility: visible;
            pointer-events: auto;

            border-top-width: 1px;
        }

        /* LOADING / EMPTY / ERROR */

        .message {
            text-align: center;
            padding: 50px 20px;
            color: #9ca3af;
            font-size: 15px;
            grid-column: 1 / -1;
        }

        /* FOOTER */

        footer {
            text-align: center;
            padding: 25px 15px;

            border-top: 1px solid #374151;
            color: #6b7280;
            font-size: 13px;
        }

        footer a {
            color: #60a5fa;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        /* TABLET */

        @media (max-width: 900px) {
            .games-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 18px;
            }
        }

        /* MOBILE */

        @media (max-width: 600px) {
            header h1 {
                font-size: 25px;
            }

            main {
                padding: 22px 12px 40px;
            }

            .games-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
            }

            .game-card {
                min-height: 310px;
                border-radius: 10px;
            }

            .game-image {
                height: 125px;
            }

            .game-emoji {
                font-size: 45px;
            }

            .game-content {
                padding: 12px 10px 8px;
            }

            .game-title {
                font-size: 15px;
            }

            .game-category {
                font-size: 10px;
                padding: 3px 8px;
            }

            .game-short-description {
                font-size: 11px;
            }

            .play-button {
                margin: 0 10px 12px;
                padding: 9px 8px;
                font-size: 12px;
            }

            .description-overlay {
                padding-left: 10px;
                padding-right: 10px;
            }

            .game-card.show-description .description-overlay {
                max-height: 180px;
                padding: 12px 10px 14px;
            }

            /* Disable hover expansion on touch devices */
            .game-card:hover .description-overlay {
                max-height: 0;
                padding: 0 10px;
                opacity: 0;
                visibility: hidden;
                border-top-width: 0;
            }

            .game-card.show-description:hover .description-overlay {
                max-height: 180px;
                padding: 12px 10px 14px;
                opacity: 1;
                visibility: visible;
                border-top-width: 1px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>🎮 My Game Arcade</h1>
        <p>Discover and play amazing games</p>
    </header>

    <main>

        <div class="search-container">
            <input
                type="text"
                id="searchInput"
                placeholder="Search games..."
                autocomplete="off"
            >
        </div>

        <div class="games-grid" id="gamesGrid">
            <div class="message">Loading games...</div>
        </div>

    </main>

    <footer>
        <p>
            © 2026 My Game Arcade |
            <a href="./admin.html">Admin</a>
        </p>
    </footer>

    <!-- FIREBASE -->

    <script type="module">

        import { firebaseConfig } from "./firebase-config.js";

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

        import {
            getFirestore,
            collection,
            query,
            orderBy,
            onSnapshot
        } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


        // Initialize Firebase

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);


        // DOM

        const gamesGrid = document.getElementById("gamesGrid");
        const searchInput = document.getElementById("searchInput");


        // Data

        let allGames = [];


        // Escape HTML to prevent HTML injection

        function escapeHTML(value) {

            return String(value ?? "").replace(/[&<>"']/g, function(char) {

                const entities = {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#039;"
                };

                return entities[char];

            });

        }


        // Validate game URL

        function safeGameURL(url) {

            if (!url) return "#";

            const value = String(url).trim();

            try {

                const parsed = new URL(value, window.location.href);

                if (
                    parsed.protocol === "http:" ||
                    parsed.protocol === "https:"
                ) {
                    return escapeHTML(value);
                }

            } catch (error) {

                return "#";

            }

            return "#";

        }


        // Validate image URL

        function safeImageURL(url) {

            if (!url) return "";

            const value = String(url).trim();

            try {

                const parsed = new URL(value, window.location.href);

                if (
                    parsed.protocol === "http:" ||
                    parsed.protocol === "https:"
                ) {
                    return escapeHTML(value);
                }

                return "";

            } catch (error) {

                return "";

            }

        }


        // Render games

        function renderGames() {

            const keyword = searchInput.value
                .trim()
                .toLowerCase();

            const filteredGames = allGames.filter(game => {

                const name = String(game.name || "").toLowerCase();
                const category = String(game.category || "").toLowerCase();
                const description = String(game.description || "").toLowerCase();

                return (
                    name.includes(keyword) ||
                    category.includes(keyword) ||
                    description.includes(keyword)
                );

            });


            // Empty state

            if (filteredGames.length === 0) {

                gamesGrid.innerHTML = `
                    <div class="message">
                        No games found.
                    </div>
                `;

                return;

            }


            // Generate cards

            gamesGrid.innerHTML = filteredGames.map(game => {

                const name = escapeHTML(game.name || "Untitled Game");

                const category = escapeHTML(game.category || "Other");

                const description = escapeHTML(
                    game.description || "No description available."
                );

                const imageURL = safeImageURL(game.imageUrl);

                const gameURL = safeGameURL(game.url);

                const emoji = escapeHTML(game.emoji || "🎮");


                // Image or emoji

                const imageHTML = imageURL
                    ? `
                        <img
                            src="${imageURL}"
                            alt="${name}"
                            loading="lazy"
                            onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
                        >
                        <span class="game-emoji" style="display:none">
                            ${emoji}
                        </span>
                    `
                    : `
                        <span class="game-emoji">
                            ${emoji}
                        </span>
                    `;


                // External links open in new tab

                let externalAttributes = "";

                if (
                    gameURL.startsWith("http://") ||
                    gameURL.startsWith("https://")
                ) {
                    externalAttributes = `
                        target="_blank"
                        rel="noopener noreferrer"
                    `;
                }


                return `

                    <div class="game-card">

                        <div class="game-image">
                            ${imageHTML}
                        </div>

                        <div class="game-content">

                            <h2 class="game-title">
                                ${name}
                            </h2>

                            <span class="game-category">
                                ${category}
                            </span>

                            <p class="game-short-description">
                                ${description}
                            </p>

                        </div>

                        <a
                            class="play-button"
                            href="${gameURL}"
                            ${externalAttributes}
                        >
                            Play Now →
                        </a>

                        <div class="description-overlay">

                            <h3>About this game</h3>

                            <p>
                                ${description}
                            </p>

                        </div>

                    </div>

                `;

            }).join("");


            // Mobile: tap card to expand/collapse description

            gamesGrid.querySelectorAll(".game-card").forEach(card => {

                card.addEventListener("click", function(event) {

                    // Do not toggle when clicking Play Now

                    if (event.target.closest("a")) {
                        return;
                    }

                    // Only use click toggle on touch devices

                    if (window.matchMedia("(hover: none)").matches) {

                        this.classList.toggle("show-description");

                    }

                });

            });

        }


        // Search

        searchInput.addEventListener("input", renderGames);


        // Load games from Firestore

        const gamesQuery = query(
            collection(db, "games"),
            orderBy("order", "asc")
        );


        onSnapshot(
            gamesQuery,

            snapshot => {

                allGames = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));

                renderGames();

            },

            error => {

                console.error("Firestore error:", error);

                gamesGrid.innerHTML = `
                    <div class="message">
                        Unable to load games. Please try again later.
                    </div>
                `;

            }

        );

    </script>

</body>
</html>
